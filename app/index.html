<!-- 小满家账的页面骨架：侧边导航、月份切换、各视图挂载点与记账弹窗，逻辑全部在 js/ 模块里。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小满家账 · 一家人的温暖账本</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div id="app-shell" class="shell">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">满</div>
      <div>
        <div class="brand-name">小满家账</div>
        <div class="brand-sub">一家人的温暖账本</div>
      </div>
    </div>
    <nav id="main-nav" class="nav" aria-label="主导航">
      <a href="#/overview" data-nav="overview" class="nav-item">总览</a>
      <a href="#/ledger" data-nav="ledger" class="nav-item">流水</a>
      <a href="#/budgets" data-nav="budgets" class="nav-item">预算</a>
      <a href="#/stats" data-nav="stats" class="nav-item">统计</a>
      <a href="#/goals" data-nav="goals" class="nav-item">储蓄目标</a>
      <a href="#/members" data-nav="members" class="nav-item">家庭成员</a>
    </nav>
    <div class="sidebar-foot">
      <div id="sidebar-tip" class="sidebar-tip">日子不紧不慢，账要记得明明白白。</div>
      <button id="theme-toggle" class="ghost-btn" type="button">切换深色模式</button>
    </div>
  </aside>

  <main id="main-area" class="main">
    <header id="topbar" class="topbar">
      <div>
        <h1 id="page-title" class="page-title">本月总览</h1>
        <p id="page-subtitle" class="page-subtitle">林小满一家 · 四口人的小日子</p>
      </div>
      <div class="topbar-actions">
        <div id="month-switcher" class="month-switcher">
          <button id="month-prev" class="icon-btn" type="button" aria-label="上个月">‹</button>
          <span id="month-label" class="month-label">2026 年 11 月</span>
          <button id="month-next" class="icon-btn" type="button" aria-label="下个月">›</button>
        </div>
        <button id="add-record-btn" class="primary-btn" type="button">＋ 记一笔</button>
      </div>
    </header>
    <section id="view-root" class="view-root" aria-live="polite"></section>
  </main>
</div>

<nav id="mobile-nav" class="mobile-nav" aria-label="移动端导航">
  <a href="#/overview" data-nav="overview">总览</a>
  <a href="#/ledger" data-nav="ledger">流水</a>
  <a href="#/budgets" data-nav="budgets">预算</a>
  <a href="#/stats" data-nav="stats">统计</a>
  <a href="#/goals" data-nav="goals">目标</a>
  <a href="#/members" data-nav="members">成员</a>
</nav>

<div id="record-modal" class="modal-backdrop" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title">记一笔</h2>
      <button id="modal-close" class="icon-btn" type="button" aria-label="关闭">✕</button>
    </div>
    <form id="record-form" class="record-form">
      <div class="type-switch" role="group" aria-label="收支类型">
        <button type="button" id="type-expense" class="type-btn active">支出</button>
        <button type="button" id="type-income" class="type-btn">收入</button>
      </div>
      <label class="field">金额（元）
        <input id="field-amount" type="number" min="0.01" step="0.01" required placeholder="0.00">
      </label>
      <label class="field">分类
        <select id="field-category" required></select>
      </label>
      <label class="field">成员
        <select id="field-member" required></select>
      </label>
      <label class="field">日期
        <input id="field-date" type="date" required>
      </label>
      <label class="field">备注
        <input id="field-note" type="text" maxlength="40" placeholder="比如：楼下菜市场的青菜和鸡蛋">
      </label>
      <div class="modal-actions">
        <button type="button" id="modal-cancel" class="ghost-btn">取消</button>
        <button type="submit" id="modal-save" class="primary-btn">存进账本</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
